[project]
name = "shadowgrouping"
version = "0.2.0"
description = "ShadowGrouping: Efficient molecular energy estimation via grouped Pauli measurements"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "qiskit<1.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7",
]
